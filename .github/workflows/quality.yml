name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

# The gate only reads the checkout; it never writes to the repository.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm audit --audit-level=high
      - name: HTTP release checks against disposable local data
        run: |
          node scripts/start-release-preview.mjs &
          preview_pid=$!
          trap 'kill "$preview_pid"; wait "$preview_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8791/ >/dev/null; then break; fi
            sleep 1
          done
          npm run check:baseline -- --base-url http://127.0.0.1:8791
          npm run check:seo -- http://127.0.0.1:8791 http://127.0.0.1:8791
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
