name: Bug report
description: Something behaves differently from what the documentation or code says it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — use private
        reporting instead. See [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. npm run dev
        2. Open Contract Register
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see this
      options:
        - Local checkout (npm run dev)
        - Local production build (npm run build)
        - The hosted demo
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, browser. `node --version` is enough for the first.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Console output, failing test, or server log. This is rendered as code, no backticks needed.
      render: shell
    validations:
      required: false
